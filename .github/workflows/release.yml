name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build for Linux (x64)
        run: bun build --compile --minify --target=bun-linux-x64 ./src/cli.ts --outfile=migrant-cli-linux-x64

      - name: Build for Linux (arm64)
        run: bun build --compile --minify --target=bun-linux-arm64 ./src/cli.ts --outfile=migrant-cli-linux-arm64

      - name: Build for macOS (arm64)
        run: bun build --compile --minify --target=bun-darwin-arm64 ./src/cli.ts --outfile=migrant-cli-macos-arm64

      - name: Build for macOS (x64)
        run: bun build --compile --minify --target=bun-darwin-x64 ./src/cli.ts --outfile=migrant-cli-macos-x64

      - name: Build for Windows (x64)
        run: bun build --compile --minify --target=bun-windows-x64 ./src/cli.ts --outfile=migrant-cli-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            migrant-cli-linux-x64
            migrant-cli-linux-arm64
            migrant-cli-macos-arm64
            migrant-cli-macos-x64
            migrant-cli-windows-x64.exe
